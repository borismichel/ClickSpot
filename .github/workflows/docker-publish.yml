name: Docker images

# Builds the ClickSpot images and publishes them to GitHub Container Registry.
#
#   ghcr.io/borismichel/clickspot-app       backend + Dagster + seed loader
#   ghcr.io/borismichel/clickspot-frontend  nginx-served SPA
#   ghcr.io/borismichel/clickspot:demo       all-in-one preloaded demo
#
# Pull is public and needs no login (one-time setup: set each package's
# visibility to Public under the repo/org Packages settings after the first push).
#
# - Pull requests build every image (no push) so the Dockerfiles are verified.
# - Tags (v*) and published releases build and push.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.demo"
      - "frontend/Dockerfile"
      - "frontend/nginx.conf.template"
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.lock"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: clickspot-app
            context: .
            dockerfile: Dockerfile
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          - name: frontend
            image: clickspot-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          - name: demo
            image: clickspot
            context: .
            dockerfile: Dockerfile.demo
            tags: |
              type=raw,value=demo
              type=semver,pattern=demo-{{version}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ matrix.tags }}

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
