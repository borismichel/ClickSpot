name: Docker images

# Builds the ClickSpot images and publishes them to GitHub Container Registry.
#
#   ghcr.io/borismichel/clickspot-app       backend + Dagster + seed loader
#   ghcr.io/borismichel/clickspot-frontend  nginx-served SPA
#   ghcr.io/borismichel/clickspot:demo       all-in-one preloaded demo
#
# Pull is public and needs no login (one-time setup: set each package's
# visibility to Public under the repo/org Packages settings after the first push).
#
# - Pull requests build every image (no push) so the Dockerfiles are verified.
# - Tags (v*) and published releases build and push.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]
  pull_request:
    paths:
      - "Dockerfile"
      - "Dockerfile.demo"
      - "frontend/**"
      - "docker/**"
      - "docker-compose.yml"
      - ".dockerignore"
      - "requirements.lock"
      # App + seed code is baked into the images and exercised by the smoke
      # test below, so changes here must re-run the build + runtime checks.
      - "app/**"
      - "scripts/**"
      - "resources/**"
      - "definitions.py"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: clickspot-app
            context: .
            dockerfile: Dockerfile
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          - name: frontend
            image: clickspot-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{major}}.{{minor}}
              type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
          - name: demo
            image: clickspot
            context: .
            dockerfile: Dockerfile.demo
            tags: |
              type=raw,value=demo
              type=semver,pattern=demo-{{version}}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: ${{ matrix.tags }}

      - name: Build and push (${{ matrix.name }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Runtime smoke test on the GitHub runners — the heavy-container host the
  # disk-constrained dev box can't be. Acceptance for CLI-14 is "yields a
  # working instance", not just "images build", so boot both delivery paths and
  # assert they serve real data and degrade cleanly with no LLM key.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Rebuild into the local daemon, reusing the build job's gha cache (cache
      # hits, not full rebuilds). Tags match what compose and `docker run` use.
      - name: Build app image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/clickspot-app:latest
          cache-from: type=gha,scope=app

      - name: Build frontend image (load)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/clickspot-frontend:latest
          cache-from: type=gha,scope=frontend

      - name: Build demo image (load)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.demo
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/clickspot:demo
          cache-from: type=gha,scope=demo

      - name: Smoke — preloaded demo image
        run: |
          set -euo pipefail
          docker run -d --name clickspot-demo -p 8080:8080 \
            ghcr.io/${{ github.repository_owner }}/clickspot:demo

          echo "::group::wait for /health"
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "demo healthy after ${i}s"; break
            fi
            if [ "$i" = "90" ]; then
              echo "demo never became healthy"; docker logs clickspot-demo; exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

          echo "Baked warehouse must be queryable with no key (deals == 244)..."
          deals=$(curl -fsS -X POST http://127.0.0.1:8080/api/v1/sql \
            -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT count() AS n FROM silver.dim_deals"}')
          echo "$deals"
          echo "$deals" | grep -q '"n":244' || { echo "demo: expected 244 deals"; exit 1; }

          echo "Chat must degrade to a clean 503 with no LLM key (not a 5xx crash)..."
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            http://127.0.0.1:8080/api/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"deals by stage","history":[]}')
          test "$code" = "503" || { echo "demo chat: expected 503, got $code"; docker logs clickspot-demo; exit 1; }
          echo "demo smoke OK"

      - name: Smoke — compose stack (fresh-clone path)
        run: |
          set -euo pipefail
          # Zero-knob default path: no HUBSPOT_TOKEN, no LLM key.
          docker compose up -d

          echo "One-shot seed must finish successfully (bronze -> silver -> gold -> anon)..."
          seed_cid=$(docker compose ps -aq seed)
          if ! timeout 420 docker wait "$seed_cid" >/dev/null; then
            echo "seed did not complete in time"; docker compose logs; exit 1
          fi
          seed_code=$(docker inspect -f '{{.State.ExitCode}}' "$seed_cid")
          test "$seed_code" = "0" || { echo "seed exited $seed_code"; docker compose logs seed; exit 1; }

          echo "::group::frontend (nginx) must proxy /health to the backend"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8193/health >/dev/null 2>&1; then
              echo "frontend->backend healthy after ${i}s"; break
            fi
            if [ "$i" = "60" ]; then
              echo "frontend never served /health"; docker compose ps; docker compose logs --tail=80; exit 1
            fi
            sleep 2
          done
          echo "::endgroup::"

          echo "And proxy an /api route through nginx to the seeded warehouse..."
          deals=$(curl -fsS -X POST http://127.0.0.1:8193/api/v1/sql \
            -H 'Content-Type: application/json' \
            -d '{"sql":"SELECT count() AS n FROM silver.dim_deals"}')
          echo "$deals"
          echo "$deals" | grep -q '"n":244' || { echo "compose: expected 244 deals via nginx"; exit 1; }
          echo "compose smoke OK"

      - name: Tear down
        if: always()
        run: |
          docker compose down -v || true
          docker rm -f clickspot-demo || true
