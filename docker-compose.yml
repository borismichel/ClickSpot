services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.2.5.45
    container_name: hs2ch-clickhouse
    ports:
      - "8124:8123"   # HTTP — offset from Langfuse's 8123
      - "9001:9000"   # Native — offset from Langfuse's 9000
    environment:
      CLICKHOUSE_USER: hs2ch
      CLICKHOUSE_PASSWORD: hs2ch
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_DB: bronze
    deploy:
      resources:
        limits:
          memory: 6g
    volumes:
      - hs2ch_ch_data:/var/lib/clickhouse
      - hs2ch_ch_logs:/var/log/clickhouse-server
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/hs2ch.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/hs2ch-profile.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    stop_grace_period: 60s
    restart: unless-stopped

volumes:
  hs2ch_ch_data:
  hs2ch_ch_logs:
