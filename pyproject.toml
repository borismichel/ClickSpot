[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickspot"
version = "0.1.4"
requires-python = ">=3.10"
# Floors are the tested minimums; the upper bounds keep us inside the major
# line the code was written against (e.g. openai 1.x — providers.py uses the
# 1.x AsyncOpenAI/chat.completions client, which 2.x breaks). Exact, fully
# transitive pins (with hashes) live in requirements.lock. Regenerate with:
#   uv pip compile pyproject.toml --all-extras --python-version 3.10 \
#       --generate-hashes --output-file requirements.lock
dependencies = [
    "dagster>=1.9.5,<2",
    "dagster-webserver>=1.9.5,<2",
    "hubspot-api-client",
    "clickhouse-connect",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "anthropic>=0.40,<1",
    "openai>=1.50,<2",
    "httpx",
    "sqlglot",
    "aiosqlite",
    "mcp[cli]>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "assets*", "resources*"]

# Top-level Python modules (not in any package). Required so the MCP server,
# which transitively imports silver_config via app.config, can be spawned from
# any cwd (e.g. Claude Desktop, which doesn't reliably honor the `cwd` field
# in its mcpServers config).
[tool.setuptools]
py-modules = ["silver_config", "definitions", "jobs", "schedules", "sensors"]

[tool.dagster]
module_name = "definitions"
