[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clickspot"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.9.5",
    "dagster-webserver",
    "hubspot-api-client",
    "clickhouse-connect",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx",
    "sqlglot",
    "aiosqlite",
    "mcp[cli]>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "assets*", "resources*"]

# Top-level Python modules (not in any package). Required so the MCP server,
# which transitively imports silver_config via app.config, can be spawned from
# any cwd (e.g. Claude Desktop, which doesn't reliably honor the `cwd` field
# in its mcpServers config).
[tool.setuptools]
py-modules = ["silver_config", "definitions", "jobs", "schedules", "sensors"]

[tool.dagster]
module_name = "definitions"
