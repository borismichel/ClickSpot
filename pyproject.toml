[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hs2ch"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "dagster>=1.9.5",
    "dagster-webserver",
    "hubspot-api-client",
    "clickhouse-connect",
    "requests",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "anthropic>=0.40",
    "openai>=1.50",
    "httpx",
    "sqlglot",
    "aiosqlite",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock"]

[tool.setuptools.packages.find]
where = ["."]
include = ["assets*", "resources*"]

[tool.dagster]
module_name = "definitions"
